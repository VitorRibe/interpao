server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise browsers keep loading an old
    # bundle (with a stale VITE_API_URL) after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: every unknown path serves index.html so client-side routes
    # (e.g. /admin/conteudo) work on direct access / refresh instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
